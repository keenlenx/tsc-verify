<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23664d">
  <title>Offline | Teacher Verification</title>
  <style>
    :root { color-scheme: light; --ink: #202724; --muted: #69736e; --green: #23664d; --paper: #fff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 1.25rem; color: var(--ink); background: #f2f5f1; font: 16px/1.5 "Segoe UI", sans-serif; }
    main { width: min(100%, 420px); padding: 1.5rem; background: var(--paper); border: 1px solid #dfe5df; border-radius: 8px; }
    h1 { margin: 0 0 .5rem; font-size: 1.4rem; }
    p { margin: 0; color: var(--muted); }
    a { display: inline-block; margin-top: 1.25rem; padding: .75rem 1rem; color: #fff; background: var(--green); border-radius: 6px; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>The verification server needs a network connection to check employee records. Reconnect, then retry.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
